[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "noteframe"
version = "0.1.0"
description = "Turn visible notes in YouTube lectures into a browsable local notebook."
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Kartikeya Trivedi"}]
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "yt-dlp[default]>=2026.8.19",
  "opencv-python-headless>=4.10,<6", "numpy>=2,<3", "Pillow>=11,<13",
  "reportlab>=4.2,<5"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "pypdf>=6,<7", "ruff>=0.11,<1"]

[project.scripts]
noteframe = "noteframe.__main__:main"

[tool.setuptools.package-data]
noteframe = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
