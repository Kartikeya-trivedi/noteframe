name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff check .
      - run: node --check noteframe/static/app.js
      - run: python -m pytest -q
  windows-bootstrap:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install local runtimes and dependencies
        shell: cmd
        run: setup.bat -LocalTools -NoPause
      - name: Verify an already prepared environment
        shell: cmd
        run: start.bat -Check -LocalTools -NoPause
      - name: Exercise bootstrap failure handling
        shell: powershell
        run: ./tests/windows.ps1
